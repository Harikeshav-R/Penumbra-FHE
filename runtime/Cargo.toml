[package]
name = "penumbra-fhe-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Penumbra-FHE runtime: the backend-neutral eval core (Layer 2) and the tfhe-rs backend (Layer 1) for encrypted ML inference."
repository.workspace = true
# crates.io allows at most 5 keywords.
keywords = ["fhe", "tfhe", "ckks", "homomorphic", "encryption"]
categories = ["cryptography"]
publish = false

[lib]
name = "penumbra_fhe_runtime"
path = "src/lib.rs"

[dependencies]
penumbra-core = { workspace = true }
penumbra-tfhe = { workspace = true }
tfhe = { version = "1.6", features = ["shortint", "integer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# (placeholder for future test-only deps)

