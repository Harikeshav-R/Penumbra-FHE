[package]
name = "penumbra-fhe-runtime"
version = "0.0.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Penumbra-FHE runtime: the backend-neutral eval core (Layer 2) and the tfhe-rs backend (Layer 1) for encrypted ML inference."
repository = "https://github.com/Harikeshav-R/Penumbra-FHE"
# crates.io allows at most 5 keywords.
keywords = ["fhe", "tfhe", "ckks", "homomorphic", "encryption"]
categories = ["cryptography"]
publish = false

[lib]
name = "penumbra_fhe_runtime"
path = "src/lib.rs"

[dependencies]
penumbra-core = { path = "../crates/penumbra-core" }
penumbra-tfhe = { path = "../crates/penumbra-tfhe" }
tfhe = { version = "1.6", features = ["shortint", "integer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Binary (de)serialization for keys + ciphertext — the client/server split's wire format
# (PROJECT.md §11, ROADMAP Phase 9). The `tfhe` key/ciphertext types derive serde, and their
# own integer-API docs use bincode; the tfhe-native `safe_serialization` is unavailable here
# (the integer-API types don't implement its `Named` trait). Keeping keys/ciphertext in a
# compact binary format (not the human-readable IR JSON) — server keys are large.
#
# Deliberately held at 1.x, and dependabot is told to skip major bumps (.github/dependabot.yml):
#   - 2.x is a full API rewrite and would change the on-disk `.cts`/`.key` byte format.
#   - 3.0.0 is a `compile_error!("https://xkcd.com/2347/")` tombstone — the upstream repo was
#     archived 2025-08-15 — but it is not yanked, so crates.io still reports it as the newest
#     stable and dependabot keeps proposing it.
#   - `tfhe` itself depends on bincode 1.x, so bumping ours would add a second copy to the
#     tree rather than retiring the old one.
# Revisit at Phase 12.1, when this wire format gains its backend tag (docs/BACKENDS.md).
bincode = "1.3"

[dev-dependencies]
# (placeholder for future test-only deps)

