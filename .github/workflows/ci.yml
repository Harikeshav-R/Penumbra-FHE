name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench_models:
        description: "Models to run in benchmark regression gate (comma-separated)"
        required: false
        default: "phase2_logreg,phase4_cnn,phase6_sklearn"
        type: string
# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # FHE is dramatically faster in release; debug test runs are impractically slow.
      - name: Test (release)
        run: cargo test --workspace --release

  ckks-spike:
    name: CKKS spike (fmt, clippy, test - nightly)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-feature=+avx2,+fma"
    defaults:
      run:
        working-directory: crates/spike-ckks
    steps:
      - uses: actions/checkout@v7

      - name: Install Nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/spike-ckks

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (release)
        run: cargo test --release

  ckks-backend:
    name: CKKS backend (clippy, test - nightly)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-feature=+avx2,+fma"
    steps:
      - uses: actions/checkout@v7
      - name: Install Nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Clippy (warnings as errors)
        run: |
          cargo clippy -p penumbra-ckks --features ckks --all-targets -- -D warnings
          cargo clippy -p penumbra-bench --features ckks --all-targets -- -D warnings
      - name: Test (release)
        run: |
          cargo test -p penumbra-ckks --features ckks --release
          cargo test -p penumbra-bench --features ckks --release
      - name: Benchmark regression gate (CKKS)
        run: |
          cargo run -p penumbra-bench --features ckks --release --bin penumbra-bench-report -- \
            --models phase2_logreg,phase4_cnn,phase6_sklearn --backends ckks --samples 1 \
            --baseline crates/penumbra-bench/baselines/ckks-baseline.json
  python:
    name: Python front end (ruff, black, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Core deps + dev tools only. The heavy `ml` extra (torch/brevitas) isn't
      # exercised in Phase 0; add a dedicated job once it is.
      - name: Sync dependencies
        run: uv sync --dev

      # Lint/format the package, tests, and examples.
      - name: Ruff
        run: uv run ruff check python tests examples

      - name: Black (check)
        run: uv run black --check python tests examples

      - name: Pytest
        run: uv run pytest

      # Packaging gate. `uv sync` only builds the wheel, so a package that is unbuildable as a
      # source distribution stays invisible until publish time (ROADMAP Phase 11). Building the
      # sdist and then installing *from it* in a clean environment is what catches the real
      # class of bug: metadata that references files outside the project, or an sdist that
      # builds but is missing what it needs to be rebuilt.
      - name: Build sdist + wheel
        run: uv build

      - name: Install from the sdist and import
        run: |
          uv venv "${RUNNER_TEMP}/sdist-check"
          uv pip install --python "${RUNNER_TEMP}/sdist-check" dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-check/bin/python" -c "import penumbra; print(penumbra.__version__)"

  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            sdist: true
          - os: macos-14
            target: aarch64
            manylinux: auto
            sdist: false
          - os: windows-latest
            target: x86_64
            manylinux: auto
            sdist: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
          sdist: ${{ matrix.sdist }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  bench-regression:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Benchmark regression gate
        run: |
          cargo run -p penumbra-bench --release --bin penumbra-bench-report -- \
            --models "${{ inputs.bench_models || 'phase2_logreg,phase4_cnn,phase6_sklearn' }}" \
            --backends tfhe --samples 1 \
            --baseline crates/penumbra-bench/baselines/tfhe-classic.json
