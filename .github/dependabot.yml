version: 2
updates:
  - package-ecosystem: cargo
    directory: /runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # bincode 3.0.0 is a `compile_error!` tombstone (upstream archived 2025-08-15) that is
      # not yanked, so crates.io reports it as the newest stable and this bump is re-proposed
      # every week. 2.x is a wire-format-breaking rewrite. Reasoning in runtime/Cargo.toml.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
