[package]
name = "penumbra-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 bindings exposing the Penumbra-FHE runtime to Python in-process."
repository.workspace = true
publish = false

[lib]
name = "_penumbra"
crate-type = ["cdylib"]
# No Rust test target. `pyo3/extension-module` leaves Py_* symbols to be resolved by the host
# interpreter at load time, so a test/bench binary for this crate would fail to link under the
# workspace's `cargo test --workspace --release` gate. The binding's behaviour is proven by the
# Python suite, which is the level it actually runs at.
test = false
bench = false

[features]
default = []
ckks = ["dep:penumbra-ckks", "penumbra-ckks/ckks"]

[dependencies]
penumbra-core = { workspace = true }
penumbra-tfhe = { workspace = true }
penumbra-ckks = { workspace = true, optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
