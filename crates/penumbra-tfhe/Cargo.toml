[package]
name = "penumbra-tfhe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Layer 1 of Penumbra-FHE: reference TFHE/CGGI backend implemented over tfhe-rs."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["fhe", "tfhe", "homomorphic", "encryption", "inference"]
categories = ["cryptography"]

[dependencies]
penumbra-core = { workspace = true }
tfhe = { version = "1.6", features = ["shortint", "integer", "pbs-stats"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rayon = "1"
