[package]
name = "penumbra-tfhe"
version = "0.0.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Layer 1 of Penumbra-FHE: reference TFHE/CGGI backend implemented over tfhe-rs."
repository = "https://github.com/Harikeshav-R/Penumbra-FHE"
publish = false

[dependencies]
penumbra-core = { path = "../penumbra-core" }
tfhe = { version = "1.6", features = ["shortint", "integer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
