[package]
name = "penumbra-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Penumbra-FHE shared comparison harness: criterion benchmarks parameterized over backend x model (ROADMAP Phase 12.3)."
repository.workspace = true
publish = false

[dependencies]
penumbra-core = { workspace = true }
penumbra-tfhe = { workspace = true }
penumbra-ckks = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rayon = "1"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
poulpy-core = { version = "=0.8.3", optional = true }

[features]
default = []
ckks = ["dep:penumbra-ckks", "penumbra-ckks/ckks", "dep:poulpy-core"]
[[bin]]
name = "penumbra-bench-report"
path = "src/bin/report.rs"

[[bin]]
name = "penumbra-mnist-scale-probe"
path = "src/bin/mnist_scale_probe.rs"

[[bench]]
name = "inference"
harness = false
test = false
