[package]
name = "penumbra-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Penumbra-FHE shared comparison harness: criterion benchmarks parameterized over backend x model (ROADMAP Phase 12.3)."
repository.workspace = true
publish = false

[dependencies]
penumbra-core = { workspace = true }
penumbra-tfhe = { workspace = true }
penumbra-ckks = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[features]
default = []
ckks = ["dep:penumbra-ckks", "penumbra-ckks/ckks"]

[[bin]]
name = "penumbra-bench-report"
path = "src/bin/report.rs"

[[bench]]
name = "inference"
harness = false
test = false
